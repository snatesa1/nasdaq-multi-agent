server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for fast asset delivery
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 1. Next.js static assets & compiled chunks
    location /_next/ {
        alias /usr/share/nginx/html/_next/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 2. Dynamic reverse-proxy for FastAPI backend API endpoints ONLY
    # Uses strict delimiters (/ or $) so frontend routes like /portfolio, /strategies, /pricer, /simulator are NEVER intercepted!
    location ~ ^/(api/|market/|price/|simulate/|greeks/|strategy/|volatility/|portfolio/greeks|tutor/|multi-agent/|fundamental-index/|health$|debug/|docs|openapi.json) {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 3. SPA routing fallback for static pages (e.g. /portfolio, /strategies, /pricer, /weekly-intelligence)
    location / {
        try_files $uri $uri.html $uri/index.html $uri/ /index.html;
    }
}
