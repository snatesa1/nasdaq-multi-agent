<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Starting OptionsLab Desktop Gateway</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    .splash-container {
      text-align: center;
      max-width: 460px;
      padding: 40px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .logo-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 68px;
      height: 68px;
      background: linear-gradient(135deg, #4051B5 0%, #6366f1 100%);
      border-radius: 18px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px -5px rgba(64, 81, 181, 0.5);
    }
    .logo-badge svg {
      width: 38px;
      height: 38px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      color: #f8fafc;
    }
    h1 span {
      color: #818cf8;
    }
    p.subtitle {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .progress-bar {
      width: 100%;
      height: 6px;
      background: #334155;
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
      margin-bottom: 16px;
    }
    .progress-bar-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, #4051B5, #818cf8, #38bdf8);
      border-radius: 9999px;
      animation: indeterminate 1.8s infinite ease-in-out;
    }
    @keyframes indeterminate {
      0% { left: -40%; width: 40%; }
      50% { left: 30%; width: 60%; }
      100% { left: 100%; width: 40%; }
    }
    .status-text {
      font-size: 12px;
      font-weight: 500;
      color: #cbd5e1;
      min-height: 20px;
    }
    .badge {
      display: inline-block;
      margin-top: 18px;
      padding: 4px 12px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 9999px;
      font-size: 11px;
      font-family: monospace;
      color: #94a3b8;
    }
    .error-box {
      display: none;
      margin-top: 20px;
      padding: 12px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-radius: 12px;
      color: #fca5a5;
      font-size: 12px;
    }
    .retry-btn {
      display: none;
      margin-top: 16px;
      padding: 10px 22px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .retry-btn:hover {
      background: #4338ca;
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <div class="logo-badge">
      <svg viewBox="0 0 24 24">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
      </svg>
    </div>
    <h1>OptionsLab <span>Trading Gateway</span></h1>
    <p class="subtitle">Autonomous AI Agent & Institutional Broker Infrastructure</p>
    
    <div class="progress-bar" id="progressBar">
      <div class="progress-bar-fill"></div>
    </div>
    <div class="status-text" id="statusText">Initializing Python quantitative engines & broker gateway...</div>
    <div class="badge" id="portBadge">Port 8000 • Windows Native</div>

    <div class="error-box" id="errorBox"></div>
    <button class="retry-btn" id="retryBtn" onclick="window.location.reload()">Retry Connection</button>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const errorMsg = params.get('error');
    if (errorMsg) {
      document.getElementById('progressBar').style.display = 'none';
      document.getElementById('statusText').innerText = 'Connection to backend timed out.';
      const errBox = document.getElementById('errorBox');
      errBox.style.display = 'block';
      errBox.innerText = decodeURIComponent(errorMsg);
      document.getElementById('retryBtn').style.display = 'inline-block';
    }

    // Listen for Electron progress updates
    if (window.desktopAPI) {
      // desktopAPI available
    }
  </script>
</body>
</html>
