name: Deploy Nasdaq Multi-Agent to GCP

on:
  push:
    branches:
      - main
      - nasdaq-multi-agent/auth

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write   # Required for Workload Identity Federation (OIDC)
      contents: read

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # Opt into Node 24 for actions

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

#      - name: Run Tests
#        run: |
#          pytest tests/

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and Push Image (Cloud Build)
        run: |
          gcloud builds submit --config cloudbuild.yaml --substitutions=_IMAGE_TAG=gcr.io/${{ steps.auth.outputs.project_id }}/nasdaq-multi-agent

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: nasdaq-multi-agent
          image: gcr.io/${{ steps.auth.outputs.project_id }}/nasdaq-multi-agent
          region: asia-southeast1
          env_vars: |
            GCP_PROJECT_ID=${{ steps.auth.outputs.project_id }}
            SLACK_CHANNEL_ID=${{ secrets.SLACK_CHANNEL_ID }}
            EMAIL_SENDER=${{ secrets.EMAIL_SENDER }}
            EMAIL_RECIPIENT=${{ secrets.EMAIL_RECIPIENT }}
            VERTEX_MODEL=${{ secrets.VERTEX_MODEL }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            DISABLE_VERTEX_FALLBACK=True

      - name: Verify Deployment
        run: |
          echo "✅ Deployment complete to ${{ steps.deploy.outputs.url }}"
          echo "🚀 Manual Trigger: curl -X POST ${{ steps.deploy.outputs.url }}/analyze"

      # ── OptionsLab Deployment ─────────────────────────────────────────────
      - name: Build and Push OptionsLab (Cloud Build)
        run: |
          gcloud builds submit --tag gcr.io/${{ steps.auth.outputs.project_id }}/options-lab ./options_lab --timeout=20m --machine-type=e2-highcpu-8

      - name: Deploy OptionsLab to Cloud Run
        id: deploy_options_lab
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: options-lab
          image: gcr.io/${{ steps.auth.outputs.project_id }}/options-lab
          region: asia-southeast1
          env_vars: |
            GCP_PROJECT_ID=${{ steps.auth.outputs.project_id }}
            VERTEX_MODEL=gemini-flash-latest
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            DISABLE_VERTEX_FALLBACK=True

      - name: Verify OptionsLab Deployment
        run: |
          echo "✅ OptionsLab Deployment complete to ${{ steps.deploy_options_lab.outputs.url }}"
